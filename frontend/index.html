<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Шрифты темы. Раньше здесь были только preconnect, а сама таблица
         стилей не подключалась: Manrope и Unbounded из @theme никогда не
         загружались, и приложение рисовалось системным фолбэком. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Theme color для мобильных браузеров -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Apple mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Описание -->
    <meta name="description" content="ДЕЛО - маркетплейс услуг и задач. Найдите исполнителя или получите заказы." />

    <title>ДЕЛО - Маркетплейс услуг</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
