<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки. Раньше здесь стоял /vite.svg, которого в public нет, — у вкладки
         не было значка вовсе. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Тема до первой отрисовки: без этого при тёмной теме страница
         на мгновение вспыхивала бы светлой, пока грузится приложение.
         Ключ и логика — те же, что в src/utils/theme.js. -->
    <script>
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem('delo-theme');
          dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>

    <!-- Шрифты темы раздаются с нашего сервера (@font-face в src/index.css),
         без Google Fonts. Предзагружаем то, что нужно любой странице сразу:
         кириллицу и латиницу (цифры, пробелы) основного шрифта и кириллицу
         заголовочного. crossorigin обязателен: шрифты грузятся в режиме CORS,
         и без него предзагрузка не совпадёт с запросом из CSS. -->
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Theme color для мобильных браузеров -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Apple mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ДЕЛО">

    <!-- Описание -->
    <meta name="description" content="Найдите специалиста для любой задачи: ремонт, уборка, IT, дизайн, доставка. Оплата через безопасную сделку — деньги переходят исполнителю только после приёмки работы." />

    <!-- Превью ссылки в Telegram, VK, WhatsApp. Адрес картинки абсолютный:
         относительный путь часть соцсетей не понимает. Домен — дело.online
         в punycode. Исходник картинки — brand/og-image.svg. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ДЕЛО" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="ДЕЛО — найдите специалиста для любой задачи" />
    <meta property="og:description" content="Услуги и товары с безопасной сделкой: эскроу, арбитраж споров, проверенные исполнители." />
    <meta property="og:image" content="https://xn--d1acsm.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ДЕЛО — найдите специалиста для любой задачи. Безопасная сделка, эскроу, арбитраж споров" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>ДЕЛО — найдите специалиста для любой задачи</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
