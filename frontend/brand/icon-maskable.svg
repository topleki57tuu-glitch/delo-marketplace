<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Иконка «на весь квадрат»: Android (purpose: maskable) и iOS
       (apple-touch-icon) сами скругляют углы, поэтому фон без скругления.
       Знак — тот же, что в favicon.svg, занимает 62% стороны и целиком
       лежит в безопасной зоне маски (круг диаметром 80%). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(97.28 97.28) scale(4.96)">
    <path d="M26 17H42V41 M26 17C26 28 24 35 20 41 M15 41H49 M15 41V48 M49 41V48" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="51" cy="15" r="4" fill="#fbbf24"/>
  </g>
</svg>
