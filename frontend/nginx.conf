# Пути страниц SPA совпадают с префиксами API (/tasks/12, /products/5,
# /admin/dashboard, /chats, /specialists). Запрос из браузера по такому адресу
# несёт Accept: text/html и должен получить страницу, а не JSON — иначе
# перезагрузка страницы или переход по прямой ссылке ломается.
map $http_accept $delo_wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Версия nginx не показывается ни в заголовке Server, ни на страницах
    # ошибок: по ней подбирают уязвимости конкретной сборки.
    server_tokens off;

    # Загрузки: у nginx по умолчанию 1 МБ, и любое фото или документ больше
    # этого отклонялись здесь с 413, не доходя до бэкенда (его лимит — 5 МБ,
    # см. backend/file_utils.py). Запас сверху — на multipart-обвязку.
    client_max_body_size 10m;

    # Реальный адрес клиента. В проде цепочка Caddy -> этот nginx -> backend,
    # и без real_ip $remote_addr здесь — адрес контейнера Caddy. Его nginx и
    # дописывал в X-Forwarded-For последним, а бэкенд берёт именно последний
    # адрес (app/core/security.py:client_ip). Итог — все пользователи для
    # бэкенда выглядели одним IP: общий лимит на вход (один перебор паролей
    # блокировал вход всем) и бесполезный журнал безопасности.
    #
    # Доверяем заголовку только от приватных сетей (docker, Caddy). Caddy
    # сам заменяет пришедший снаружи X-Forwarded-For адресом клиента, так что
    # подделать его извне нельзя.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    # Сжатие.
    #
    # gzip_proxied any — главное. Перед этим nginx стоит Caddy, а он добавляет
    # к запросу заголовок Via. Для nginx это признак проксированного запроса,
    # и при значении по умолчанию (off) такие ответы не сжимаются вовсе: так
    # и было — главная страница тянула 433 КБ скриптов вместо ~115 КБ.
    #
    # gzip_static — сборка уже кладёт рядом с файлами сжатые копии .gz
    # (vite-plugin-compression в vite.config.js, максимальная степень): их
    # nginx отдаёт как есть, не сжимая каждый ответ заново. Остальное —
    # ответы API, мелкие файлы — сжимается на лету.
    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Заголовки безопасности (CSP, HSTS, X-Frame-Options...) — в
    # nginx-security-headers.conf. include стоит в каждом location со
    # статикой: add_header из server{} туда не наследуется.
    location / {
        include /etc/nginx/snippets/delo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Кэширование. Раньше заголовков не было вовсе, и браузер решал сам:
    # мог эвристически держать старый index.html, который после деплоя
    # ссылается на уже удалённые из образа чанки.
    #
    # index.html всегда перепроверяется (ETag -> 304, если не менялся). Сюда же
    # приходят SPA-фолбэк из location / и rewrite из блока API ниже.
    location = /index.html {
        include /etc/nginx/snippets/delo-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # В /assets сборка кладёт файлы с хэшем содержимого в имени — их можно
    # кэшировать навсегда. Отсутствующий файл — честный 404, а не index.html:
    # вместо скрипта браузер получал HTML и падал с ошибкой MIME-типа.
    location /assets/ {
        include /etc/nginx/snippets/delo-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты — без хэша в имени, но меняются крайне редко.
    location /fonts/ {
        include /etc/nginx/snippets/delo-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy all backend API endpoints
    # csrf-token обязателен: без него фронт не получит токен и все
    # изменяющие запросы вернут 403. products/orders — модуль маркетплейса,
    # без них запросы уходили в SPA-fallback и возвращали index.html.
    # telegram — привязка аккаунта к боту (backend/app/api/telegram.py).
    location ~ ^/(register|login|auth|users|tasks|wallet|monetization|payments|files|upload|notifications|ai|verification|admin|chats|specialists|products|orders|telegram|csrf-token|health|docs|openapi\.json)(/.*)?$ {
        # Навигация браузера уходит в SPA, запросы данных — на бэкенд
        if ($delo_wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/delo-security-headers.conf;
        root /usr/share/nginx/html;
    }
}
