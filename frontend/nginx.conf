# Пути страниц SPA совпадают с префиксами API (/tasks/12, /products/5,
# /admin/dashboard, /chats, /specialists). Запрос из браузера по такому адресу
# несёт Accept: text/html и должен получить страницу, а не JSON — иначе
# перезагрузка страницы или переход по прямой ссылке ломается.
map $http_accept $delo_wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all backend API endpoints
    # csrf-token обязателен: без него фронт не получит токен и все
    # изменяющие запросы вернут 403. products/orders — модуль маркетплейса,
    # без них запросы уходили в SPA-fallback и возвращали index.html.
    location ~ ^/(register|login|auth|users|tasks|wallet|monetization|payments|files|upload|notifications|ai|verification|admin|chats|specialists|products|orders|csrf-token|health|docs|openapi\.json)(/.*)?$ {
        # Навигация браузера уходит в SPA, запросы данных — на бэкенд
        if ($delo_wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
