# Заголовки безопасности для страниц сайта — HTML, скриптов, стилей, шрифтов.
#
# В образе лежит в /etc/nginx/snippets/ (см. Dockerfile) и подключается
# через include в КАЖДЫЙ location из nginx.conf, который отдаёт статику.
# Почему не один раз на уровне server: add_header из server{} не наследуется
# в location, где есть собственный add_header, — а у index.html, /assets/ и
# /fonts/ он есть (Cache-Control). Без include страница осталась бы без защиты.
#
# Ответы API и /uploads сюда не входят: их заголовки ставит backend
# (security_headers в backend/main.py), а двойной Content-Security-Policy
# браузер применяет оба сразу — строжайшее пересечение.
#
# Проверка — tests/security/check_frontend_headers.py (джоба frontend в CI).

# --- Content-Security-Policy ---------------------------------------------------
# Главная защита от XSS: даже если в страницу попадёт чужой <script>,
# браузер выполнит только скрипты с наших адресов и Яндекс.Карт.
#
# script-src:
#   'sha256-…' — встроенный скрипт темы из frontend/index.html (тема до первой
#     отрисовки). Хэш считается от текста скрипта: правка этого скрипта —
#     правка хэша здесь. CI сверяет их и подскажет новое значение.
#   'unsafe-eval' и домены Яндекса — требования API Яндекс.Карт 2.1
#     (yandex.ru/dev/jsapi-v2-1/doc/ru/v2-1/dg/concepts/load, раздел про CSP).
#     Карты подключаются с параметром csp=true (src/components/taskMap/loadYmaps.js).
#   https://yastatic.net — с этого CDN загрузчик API берёт основной модуль
#     (…/out/release/full.js). Без него браузер блокировал модуль, ymaps.ready
#     не наступал, и вместо карты бесконечно крутилось «Загрузка интерактивной
#     карты…». Тот же адрес — в connect-src, на случай загрузки данных модулями.
# style-src: blob: — так стили подключают Карты в режиме csp=true;
#   'unsafe-inline' — style-атрибуты разметки (код страницы через стили не
#   выполнить, в отличие от скриптов).
# connect-src: ws/wss — чат (src/pages/ChatsPage.jsx); 'self' покрывает их не
#   во всех браузерах, поэтому адрес указан явно.
# img-src https: — тайлы Карт и картинки по внешним ссылкам.
# frame-ancestors — встроить сайт в свою страницу может только веб-версия
#   Telegram: там кнопка «ДЕЛО» у бота открывает сайт во фрейме (Mini App).
#   web.telegram.org — нынешний адрес, webk/webz — прежние. Любой другой сайт
#   встроить нас по-прежнему не может (защита от кликджекинга). Приложениям
#   Telegram на телефоне и компьютере это не нужно: там фрейма нет.
set $delo_csp "default-src 'self'";
set $delo_csp "$delo_csp; script-src 'self' 'sha256-xln3iuGkNi+miM6Om6OzzxHLVU7jP+jBLy7fmqWKfPM=' 'unsafe-eval' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://yastatic.net";
set $delo_csp "$delo_csp; style-src 'self' 'unsafe-inline' blob:";
set $delo_csp "$delo_csp; img-src 'self' data: blob: https:";
set $delo_csp "$delo_csp; font-src 'self' data:";
set $delo_csp "$delo_csp; connect-src 'self' wss://$host ws://$host https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://yastatic.net";
set $delo_csp "$delo_csp; frame-src https://api-maps.yandex.ru; child-src https://api-maps.yandex.ru";
set $delo_csp "$delo_csp; worker-src 'self' blob:; manifest-src 'self'";
set $delo_csp "$delo_csp; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org";
add_header Content-Security-Policy $delo_csp always;

# X-Frame-Options нарочно нет: он умеет только «никому» или «только себе», и
# с DENY веб-Telegram вместо мини-приложения показывал «Сайт не позволяет
# установить соединение». frame-ancestors выше понимают все браузеры,
# которые поддерживает сайт.
# Браузер не угадывает тип файла: загруженный «скрипт» под видом картинки
# не выполнится.
add_header X-Content-Type-Options "nosniff" always;
# Адреса страниц (а в них id заданий и токены ссылок) не уходят чужим сайтам.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера, микрофон и прочее сайту не нужны; геолокация — только своей
# странице (карта заданий, «рядом со мной»).
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
# HTTPS на год вперёд: браузер не откроет сайт по http даже по старой ссылке
# и не даст «прокликать» предупреждение о поддельном сертификате. По http
# (вариант без домена, deploy/Caddyfile.http) браузеры заголовок игнорируют.
add_header Strict-Transport-Security "max-age=31536000" always;
