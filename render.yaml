services:
  # ---------------- BACKEND API ----------------
  - type: web
    name: marketplace-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Версия закреплена и совпадает с CI и Dockerfile: раньше CI гонял
      # 3.13, а прод собирался на 3.11 — то есть проверялся не тот
      # интерпретатор, который едет в бой.
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Без этих двух переменных backend в production не стартует:
      # config.py бросает RuntimeError (см. app/core/config.py).
      # sync: false — значения задаются в панели Render.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Список модераторов. Пусто = модераторов нет (дефолта намеренно нет).
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-postgres
          property: connectionString

      # ---- Приём платежей (ЮMoney) ------------------------------------
      # Читаются напрямую через os.getenv (app/integrations/yoomoney.py),
      # а не через settings, поэтому их отсутствие не роняет старт — оно
      # молча отключает оплату: is_configured() вернёт False, а /payments/create
      # начнёт отвечать 400 «ЮMoney не настроен».
      #
      # ACCESS_TOKEN — из https://yoomoney.ru/myservices/online (OAuth).
      - key: YOOMONEY_ACCESS_TOKEN
        sync: false
      - key: YOOMONEY_CLIENT_ID
        sync: false
      # Регистрируется в кабинете ЮMoney; в коде не используется, нужен
      # только для получения токена.
      - key: YOOMONEY_REDIRECT_URI
        sync: false
      # Секрет подписи вебхука. ОБЯЗАТЕЛЕН: без него /payments/webhook/yoomoney
      # возвращает 403 на всё, и пополнения через вебхук не зачисляются.
      # Должен совпадать со значением в кабинете ЮMoney — этот же секрет
      # используется там как «Секрет для проверки подписи».
      - key: YOOMONEY_NOTIFICATION_SECRET
        sync: false
      # Куда вернуть плательщика после оплаты (подставляется в successURL).
      # Путь на фронтенде; по умолчанию /profile — на нём же сработает
      # автоматическое подтверждение платежа.
      - key: YOOMONEY_RETURN_PATH
        value: /profile

      # ---- Redis -------------------------------------------------------
      # Без него приложение работает, но деградирует: счётчики rate-limit
      # уезжают в память процесса (лимит умножается на число воркеров),
      # а кэш отключается целиком. См. app/core/security.py и app/core/cache.py.
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString

  # ---------------- CELERY WORKER ----------------
  # Без него не выполняется ни одна задача из app/tasks/*: ни уборка
  # уведомлений и истёкших токенов, ни снятие флагов PRO. Раньше воркера
  # не было ни здесь, ни в docker-compose.prod.yml, ни в ecosystem.config.cjs.
  #
  # type: worker, а не web: у процесса нет HTTP-порта, Render не должен его
  # опрашивать.
  #
  # ВНИМАНИЕ по плану: background worker недоступен на бесплатном плане Render.
  # Если план бесплатный — этот сервис не поднимется, и задачи не будут
  # выполняться; тогда либо платный план, либо VPS-контур
  # (docker-compose.prod.yml, там воркер и beat уже описаны).
  #
  # Окружение продублировано из backend намеренно: envVarGroups здесь
  # не подходит — в группе нельзя ни `sync: false`, ни ссылку на сервис или
  # базу, а у нас и то и другое (ADMIN_EMAILS, DATABASE_URL, REDIS_URL).
  # Расхождение списков ловит тест tests/security/check_celery_tasks.py:
  # он сверяет наборы переменных у backend, worker и beat.
  - type: worker
    name: marketplace-worker
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-postgres
          property: connectionString
      - key: YOOMONEY_ACCESS_TOKEN
        sync: false
      - key: YOOMONEY_CLIENT_ID
        sync: false
      - key: YOOMONEY_REDIRECT_URI
        sync: false
      - key: YOOMONEY_NOTIFICATION_SECRET
        sync: false
      - key: YOOMONEY_RETURN_PATH
        value: /profile
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString

  # ---------------- CELERY BEAT (расписание) ----------------
  # Воркер исполняет задачи, но не решает, когда их запускать: за расписание
  # отвечает beat, и это отдельный процесс. Без него воркер простоял бы вечно
  # с пустой очередью — то есть «поднять воркер» без beat не решает задачу,
  # а только создаёт видимость.
  - type: worker
    name: marketplace-beat
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-postgres
          property: connectionString
      - key: YOOMONEY_ACCESS_TOKEN
        sync: false
      - key: YOOMONEY_CLIENT_ID
        sync: false
      - key: YOOMONEY_REDIRECT_URI
        sync: false
      - key: YOOMONEY_NOTIFICATION_SECRET
        sync: false
      - key: YOOMONEY_RETURN_PATH
        value: /profile
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString

  # ---------------- FRONTEND SPA ----------------
  - type: web
    name: marketplace-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: marketplace-backend
          property: host

  # ---------------- TELEGRAM BOT (Радар заказов) ----------------
  # type: web, а не worker: бот поднимает собственный health-сервер на $PORT
  # (bot/bot.py), иначе Render считает сервис мёртвым.
  #
  # ВНИМАНИЕ: подписки радара лежат в файле `subscriptions.json` внутри
  # контейнера. На Render файловая система эфемерна — при каждом деплое
  # файл исчезает, и все подписки обнуляются. Для сохранности нужен
  # persistent disk (на бесплатном плане недоступен) либо перенос
  # хранилища в базу. Сейчас — как есть.
  - type: web
    name: marketplace-bot
    runtime: python
    buildCommand: cd bot && pip install -r requirements.txt
    startCommand: cd bot && python bot.py
    envVars:
      # Токен от @BotFather.
      - key: TG_BOT_TOKEN
        sync: false
      # Без этой переменной бот уйдёт на захардкоженный дефолт
      # (delos-backend.onrender.com) — то есть в чужое окружение, и будет
      # молча работать не с той базой. Поэтому адрес берём из сервиса.
      - key: API_URL
        fromService:
          type: web
          name: marketplace-backend
          property: hostport
      - key: FRONTEND_URL
        fromService:
          type: web
          name: marketplace-frontend
          property: host

databases:
  - name: marketplace-postgres
    databaseName: marketplace_db
    user: marketplace
    plan: free

  # Redis под rate-limit и кэш. Если план не позволяет — удалите и уберите
  # REDIS_URL у backend: приложение поднимется, но с деградацией (см. выше).
  - name: marketplace-redis
    type: redis
    plan: free
    ipAllowList: []
