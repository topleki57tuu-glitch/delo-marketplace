services:
  # ---------------- BACKEND API ----------------
  - type: web
    name: marketplace-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Без этих двух переменных backend в production не стартует:
      # config.py бросает RuntimeError (см. app/core/config.py).
      # sync: false — значения задаются в панели Render.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Список модераторов. Пусто = модераторов нет (дефолта намеренно нет).
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-postgres
          property: connectionString

  # ---------------- FRONTEND SPA ----------------
  - type: web
    name: marketplace-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: marketplace-backend
          property: host

databases:
  - name: marketplace-postgres
    databaseName: marketplace_db
    user: marketplace
    plan: free
