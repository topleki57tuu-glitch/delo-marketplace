name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяем предыдущий прогон, если в ту же ветку пришёл новый пуш:
# незачем ждать устаревший результат.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Бэкенд: поднимаем Postgres и Redis (как в проде), прогоняем миграции,
  # запускаем приложение и все e2e-наборы.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        # Без health-gate шаги начнут выполняться до готовности БД
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # development включаем ЯВНО: начиная с fail-closed-логики config.py
      # отсутствие ENV означает production, и тесты, проверяющие dev-контракт
      # (/auth/forgot-password → dev_reset_link, демо-пополнение кошелька),
      # без этой строки упадут.
      ENV: development
      # Тестируем на PostgreSQL, а не на SQLite: именно эта СУБД в проде,
      # и часть поведения (уровни изоляции, SERIALIZABLE-конфликты) отличается.
      DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      ADMIN_EMAILS: admin@delo.ru
      # Пароль демо-аккаунтов фиксируем, чтобы тесты знали, чем логиниться
      DEMO_PASSWORD: ci-demo-password
      # Секрет вебхука ЮMoney нужен И серверу, И тесту: тест считает подпись
      # тем же алгоритмом, и без общего секрета набор печатал SKIP и выходил
      # с кодом 0 — то есть выглядел пройденным, ничего не проверив.
      YOOMONEY_NOTIFICATION_SECRET: ci-yoomoney-notification-secret
      # CSRF включаем принудительно — тесты должны доказывать защиту,
      # а не проходить из-за выключенной проверки.
      CSRF_ENABLED: "1"
      # Лимиты здесь выключены намеренно. e2e-наборы создают десятки аккаунтов
      # подряд с одного IP и упираются в лимит register (5 в час), из-за чего
      # падают не из-за дефекта, а из-за собственного объёма. Сами лимиты
      # проверяются в job production-profile, где включены автоматически.
      RATE_LIMIT_ENABLED: "0"
      # CI слушает plain HTTP, поэтому флаг Secure у cookie нужно снять:
      # с ним клиент не отправит csrf_token обратно и все записи упадут 403.
      COOKIE_SECURE: "0"
      DELO_BASE: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Оба файла, а не только requirements.txt: кэш setup-python ключуется
          # по перечисленным путям, и без второй строки правка dev-зависимостей
          # не сбросит кэш — вернётся старое окружение без httpx.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Именно requirements-dev.txt: наборы «Run self-contained regression
      # suites» поднимают приложение через fastapi.testclient, а тот требует
      # httpx. Без него первый же набор (repro_payment_cycle) падал на импорте
      # с ModuleNotFoundError, и вся вторая группа — восемь регрессов на деньги
      # и удаление данных — не выполнялась ни разу.
      # В образ httpx не попадает: backend/Dockerfile ставит только
      # requirements.txt.
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # Статическая проверка неопределённых имён (ruff F821).
      #
      # Зачем отдельный шаг. Дефект этого класса уже случился прямо в аудите:
      # в восьми роутерах выражение `x.value if hasattr(x, "value") else str(x)`
      # заменяли на общий хелпер `enum_value`, и в двух файлах правку импорта
      # затёрло при редактировании. `compileall` такое пропускает — имя не
      # разрешается при компиляции, — а наборы не ловят: `NameError` вылезает
      # только на конкретном запросе, а `/wallet/transactions` до этого не
      # вызывал ни один тест.
      #
      # Только F821, а не весь набор правил: цель не переформатировать проект,
      # а не пускать в main код, падающий на несуществующем имени. Версия
      # зафиксирована в requirements-dev.txt, чтобы новые правила не сломали CI
      # молча при обновлении.
      - name: Lint undefined names
        run: python -m ruff check backend tests --select F821

      - name: Apply migrations to a clean database
        working-directory: backend
        run: alembic upgrade head

      # ENV=development задан выше, в блоке env. Часть тестов проверяет
      # именно dev-контракт: /auth/forgot-password отдаёт dev_reset_link без
      # SMTP, а демо-пополнение кошелька позволяет довести сделку до эскроу
      # без реального платёжного провайдера. В production обе возможности
      # выключены — боевой профиль проверяется отдельной job-ой ниже.
      - name: Seed demo data
        working-directory: backend
        run: python seed_demo.py

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "Waiting for the app to accept requests..."
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/csrf-token > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start, dumping log:"
          cat /tmp/uvicorn.log
          exit 1

      # Проверка примеров кода в документации. Поднятый сервер ей не нужен:
      # она только разбирает блоки ```python и убеждается, что имена,
      # импортируемые из app.*, существуют. Ловит класс, который уже случался:
      # FAQ учил get_password_hash и колонке password, CONTRIBUTING —
      # get_current_user и схеме TaskPublic, которых в проекте нет.
      #
      # Скрипт содержит самопроверку: если детектор перестанет ловить заведомо
      # битый пример, он вернёт код 3 и упадёт. Иначе проверка может печатать
      # «0 битых» просто потому, что пакет app не загрузился.
      - name: Check documentation code samples
        run: python tests/check_docs_code_samples.py

      - name: Run test suites
        run: |
          set -e
          # Все наборы ниже работают по HTTP против поднятого backend и его
          # базы (DATABASE_URL задан в env джобы — и серверу, и тестам, иначе
          # тест вебхука писал бы запись в другую базу и падал с 404).
          #
          # Порядок важен: e2e_new_features_test ожидает свежесидированную
          # базу, поэтому идёт первым из наборов, которые её меняют.
          for suite in \
            test_auth_flow \
            security/check_refresh_token_whitelist \
            test_csrf_coverage \
            test_chat_reviews_notifications \
            e2e_new_features_test \
            e2e_api_test \
            test_yoomoney_webhook \
            repro_chat_attachment_base64 \
            security/repro_files_public_access
          do
            echo "::group::$suite"
            python "tests/${suite}.py"
            echo "::endgroup::"
          done

      # Самодостаточные наборы: поднимают приложение через TestClient и работают
      # с собственной временной SQLite-базой. DATABASE_URL здесь снимаем —
      # иначе они подхватят базу CI-джобы и будут писать в неё.
      #
      # Раньше эти наборы не запускались в CI вообще, и среди них были
      # регрессы на денежные дефекты (зачисление без оплаты, бессрочная
      # PRO-подписка) и на удаление данных (уборка файлов). Такой регресс без
      # прогона не защищает ни от чего: откат фикса давал зелёный CI.
      - name: Run self-contained regression suites
        run: |
          set -e
          unset DATABASE_URL
          for suite in \
            repro_payment_cycle \
            repro_mobile_avatar \
            security/repro_upload_reject \
            security/check_pro_expiry \
            security/repro_yookassa_unpaid_credit \
            security/check_file_cleanup \
            security/repro_verification_document_access \
            security/check_pending_payment_recovery \
            security/check_goods_order_escrow \
            security/check_tasks_list_cache \
            security/check_online_status \
            security/check_enum_null_serialization \
            security/check_private_attachment_access \
            security/check_withdrawal_review \
            security/check_celery_tasks \
            security/check_payment_amount_credit
          do
            echo "::group::$suite"
            python "tests/${suite}.py"
            echo "::endgroup::"
          done

      # Смена пароля админа — отдельным шагом, а не строкой в общем списке.
      #
      # Набор меняет пароль admin@delo.ru (шаг 6) и возвращает исходный (шаг 7).
      # В общем цикле он двигал бы login-лимиты всем, кто идёт следом, поэтому
      # запускается последним: после него в этой джобе не логинится никто, и
      # цена его побочных эффектов — ноль. Зависимостей от demo_password.txt
      # внутри джобы больше нет: seed_demo.py создаёт файл до старта сервера.
      #
      # Ради этого набора набор переведён с сырого urllib на Session: CI
      # поднимает бэкенд с CSRF_ENABLED=1, а POST /users/me/password требует
      # verify_csrf. Без Session набор падал бы на первой же проверке смены.
      - name: Check admin password change
        run: python tests/security/check_admin_password_change.py

      - name: Show backend log on failure
        if: failure()
        run: tail -n 200 /tmp/uvicorn.log

  # ---------------------------------------------------------------------------
  # Лимит перебора пароля по аккаунту.
  #
  # Здесь, а не в джобе backend, потому что требует RATE_LIMIT_ENABLED=1,
  # а там лимиты выключены намеренно: e2e-наборы создают десятки аккаунтов
  # с одного адреса и упираются в лимит register (5 в час), падая из-за
  # собственного объёма, а не из-за дефекта.
  #
  # Проверяем именно лимит ПО АККАУНТУ, а не по IP: каждый запрос набора
  # уходит с собственного X-Forwarded-For, поэтому 429 на девятой попытке
  # доказывает, что счётчик привязан к учётной записи. С выключенными
  # лимитами набор зелёный и ничего не проверяет — как раз тот случай,
  # когда защиту «подтверждает» её отсутствие.
  # ---------------------------------------------------------------------------
  login-throttle:
    name: Login throttle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketplace_throttle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_throttle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: development
      DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_throttle
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAILS: admin@delo.ru
      DEMO_PASSWORD: ci-demo-password
      CSRF_ENABLED: "1"
      COOKIE_SECURE: "0"
      # Главное отличие джобы: лимиты включены, иначе набор нечего проверять.
      RATE_LIMIT_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations to a clean database
        working-directory: backend
        run: alembic upgrade head

      # Файл с паролями создаёт seed_demo.py, и без него набор падает на
      # чтении: он берёт из demo_password.txt пароль и админа, и демо-аккаунта.
      - name: Seed demo data
        working-directory: backend
        run: python seed_demo.py

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "Waiting for the app to accept requests..."
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/csrf-token > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start, dumping log:"
          cat /tmp/uvicorn.log
          exit 1

      # Гейт перед прогоном. Набор проверяет наличие лимита, поэтому с
      # выключенным RATE_LIMIT_ENABLED он не «пройдёт с оговоркой» — он
      # будет врать. Убеждаемся отдельно, что защита включена и отвечает 429
      # после восьми неудач по одному аккаунту с разных адресов.
      - name: Assert the account throttle is armed
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request

          def login(email, password, ip):
              data = urllib.parse.urlencode({"username": email, "password": password}).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:8000/login",
                  data=data,
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded",
                      "X-Forwarded-For": ip,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          codes = [login("gate-probe@delo.ru", "мусор", f"198.51.100.{i}") for i in range(1, 13)]
          print(f"коды попыток: {codes}")
          if 429 not in codes:
              raise SystemExit(
                  "лимит по аккаунту не сработал: набор нечего доказывать, "
                  "проверь RATE_LIMIT_ENABLED и Redis"
              )
          print("лимит по аккаунту включён: после восьми неудач пришёл 429")
          PY

      - name: Check login throttle
        run: python tests/security/check_login_throttle.py

      - name: Show backend log on failure
        if: failure()
        run: tail -n 200 /tmp/uvicorn.log

  # ---------------------------------------------------------------------------
  # Миграции на чистой базе, на обеих СУБД.
  #
  # Джоб появился после двух реальных дефектов, которые SQLite не показывал:
  #   1) миграция b31957f1dbe9 использовала функции datetime()/strftime() —
  #      их нет в PostgreSQL, и `alembic upgrade head` падал на проде;
  #   2) миграция c7a1e4b90d52 добавляла колонку типа `paymentstatus`, но сам
  #      PG-тип никто не создавал (sa.Enum в add_column не печатает CREATE TYPE);
  #   3) миграция 58d19b210bdf расширяла `transactiontype` новыми значениями,
  #      но на PostgreSQL alter_column их не добавлял — падал вывод средств.
  # Все три видны только на чистой базе и только на Postgres. Поэтому здесь мы
  # разворачиваем схему с нуля на обеих СУБД и сверяем с моделями.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations on a clean database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketplace_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Migrate a clean PostgreSQL database
        working-directory: backend
        env:
          ENV: development
          DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_migrations
        run: |
          # Два полных круга, а не один. Один круг не ловит два дефекта:
          #   - b31957f1dbe9 падала на ПОВТОРНОМ прогоне (колонки уже перелиты,
          #     to_char получал varchar без каста);
          #   - drop_table не удаляет PG-типы, поэтому повторный upgrade падал
          #     с «тип disputestatus уже существует».
          # Оба видны только со второго прохода.
          for round in 1 2; do
            echo "::group::PostgreSQL round ${round}"
            alembic upgrade head
            alembic downgrade base
            echo "::endgroup::"
          done
          alembic upgrade head
          echo "PostgreSQL: два полных круга upgrade/downgrade и финальный upgrade"

      - name: Migrate a clean SQLite database
        working-directory: backend
        env:
          ENV: development
          DATABASE_URL: sqlite:////tmp/migrations_check.db
        run: |
          rm -f /tmp/migrations_check.db
          # SQLite: только upgrade. Полный цикл здесь не гоняем — в SQLite
          # DDL не транзакционен, и частично откаченная схема не откатится
          # целиком, поэтому «повторный прогон» проверяет не то, что в PG.
          for round in 1 2; do
            rm -f /tmp/migrations_check.db
            alembic upgrade head
          done
          echo "SQLite: схема разворачивается с нуля дважды (регресс по диалекту не внесён)"

      - name: Schema matches the models
        working-directory: backend
        env:
          ENV: development
          # Сверяем на Postgres: он единственный проверяет типы по-настоящему.
          DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_migrations
        run: |
          # После upgrade head схема обязана совпасть с моделями. Если разошлась —
          # в проде отвалится запрос, который локально работал.
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from sqlalchemy import inspect, create_engine
          from app.core.config import settings
          from app.core.database import Base
          from app import models  # noqa: F401 — регистрирует все таблицы

          engine = create_engine(settings.DB_URL)
          inspector = inspect(engine)
          actual = set(inspector.get_table_names()) - {"alembic_version"}
          expected = set(Base.metadata.tables)

          missing = expected - actual
          if missing:
              raise SystemExit(f"Миграции не создали таблицы: {sorted(missing)}")
          print(f"Все {len(expected)} таблиц из моделей присутствуют в схеме")

          # Отдельно проверяем enum-типы: именно они ломались на Postgres.
          with engine.connect() as conn:
              rows = conn.exec_driver_sql(
                  "SELECT t.typname, array_agg(e.enumlabel ORDER BY e.enumsortorder) "
                  "FROM pg_type t JOIN pg_enum e ON e.enumtypid = t.oid "
                  "GROUP BY t.typname"
              ).fetchall()
          pg_enums = {name: set(values) for name, values in rows}

          # Значения, без которых приложение не работает (см. app/models).
          required = {
              "transactiontype": {"withdraw_hold", "withdraw_refund"},
              "paymentstatus": {"created", "paid"},
              "orderstatus": {"pending", "cancelled"},
          }
          for type_name, values in required.items():
              assert type_name in pg_enums, f"PG-тип {type_name} не создан"
              absent = values - pg_enums[type_name]
              assert not absent, f"В PG-типе {type_name} нет значений: {sorted(absent)}"
          print("PG-типы (включая transactiontype и paymentstatus) на месте")
          PY

  # ---------------------------------------------------------------------------
  # Боевой профиль: проверяем, что приложение вообще стартует с ENV=production
  # и что защитные механизмы включаются сами, без явных флагов. Это ловит
  # класс ошибок «локально всё работало, на сервере не поднялось»: например,
  # отсутствие SECRET_KEY/CORS_ORIGINS или падение на импорте.
  # ---------------------------------------------------------------------------
  production-profile:
    name: Production config smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketplace_prod_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_prod_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_prod_smoke
          ENV: production
          SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
          CORS_ORIGINS: https://example.com
        run: alembic upgrade head

      - name: Assert production settings are locked down
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_prod_smoke
          SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
          CORS_ORIGINS: https://example.com
        run: |
          ENV=production python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from app.core.config import settings

          assert settings.IS_PRODUCTION, "ENV=production должен давать IS_PRODUCTION=True"
          assert settings.CSRF_ENABLED, "В production CSRF обязан быть включён"
          assert settings.RATE_LIMIT_ENABLED, "В production лимиты обязаны быть включены"
          assert settings.COOKIE_SECURE, "В production cookie обязаны быть Secure (HTTPS)"
          print("production-профиль: CSRF, rate-limit и Secure-cookie включены")
          PY

      - name: Assert production refuses to boot without SECRET_KEY
        working-directory: backend
        run: |
          # Без SECRET_KEY приложение обязано упасть, а не стартовать
          # со сгенерированным ключом: иначе токены становятся невалидными
          # при каждом рестарте и подпись можно подделать.
          if ENV=production CORS_ORIGINS=https://example.com python -c \
             "import sys; sys.path.insert(0,'.'); from app.core.config import settings" 2>/dev/null; then
            echo "ОШИБКА: приложение стартовало в production без SECRET_KEY"
            exit 1
          fi
          echo "production без SECRET_KEY: старт заблокирован, как и ожидалось"

      - name: Assert seed refuses to run in production
        working-directory: backend
        run: |
          # Демо-данные создают аккаунт арбитра — на боевом контуре это дыра.
          if ENV=production \
             SECRET_KEY=ci-secret-key-not-used-in-production-0123456789 \
             CORS_ORIGINS=https://example.com \
             DATABASE_URL=postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_prod_smoke \
             python seed_demo.py 2>/dev/null; then
            echo "ОШИБКА: seed_demo.py отработал в production"
            exit 1
          fi
          echo "production: seed заблокирован, как и ожидалось"

  # ---------------------------------------------------------------------------
  # Фронтенд: юнит-тесты и production-сборка.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, а не install: воспроизводимость и проверка, что lock-файл
      # синхронизирован с package.json.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Build production bundle
        run: npx vite build

      # Проверка после сборки, а не вместо неё: источник правды — то, что
      # реально уехало в браузер.
      #
      # Зачем. ec1271f переписал index.css со светлой палитрой и вместе с
      # блоком тёмных токенов выкинул @utility glass и одиннадцать токенов
      # цвета. В разметке они остались — 16 мест с glass и ~170 с text-ink,
      # text-muted, border-border. Tailwind в такой ситуации не падает и
      # ничего не пишет: он просто не генерирует правило для класса, которого
      # не знает. Сборка зелёная, vitest 20/20 зелёный, а панель уведомлений
      # прозрачная — текст накладывается на текст страницы. Дефект нашёл
      # пользователь по скриншоту, а не CI.
      #
      # Проверка падает только на НОВЫЙ пропуск: старый долг в CSS страниц
      # товаров лежит в frontend/scripts/css-baseline.json.
      - name: Check that every className has a CSS rule
        run: npm run check:css

  # ---------------------------------------------------------------------------
  # Форма смены пароля — через настоящий браузер, а не через API.
  #
  # Отдельная джоба, потому что ей нужно то, чего нет ни у кого больше:
  # браузер (Playwright) и одновременно живой фронтенд, живой бэкенд и
  # Postgres. Проверять только API здесь бессмысленно — набор ловит дефекты
  # уровня разметки: карточка «Безопасность» пропала из профиля, кнопка не
  # раскрывает форму, повтор пароля не сверяется на клиенте. Такие вещи
  # API-тесты не видят в принципе.
  #
  # Версия Playwright зафиксирована и не берётся из frontend/package.json:
  # в самом приложении его нет, он нужен только этой проверке. При обновлении
  # версии надо обновлять и кэш браузеров — их ревизия привязана к пакету.
  # ---------------------------------------------------------------------------
  password-form:
    name: Profile password form (browser)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: marketplace_password_form
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_password_form"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: development
      DATABASE_URL: postgresql+psycopg2://marketplace:ci_password@localhost:5432/marketplace_password_form
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-used-in-production-0123456789
      # Именно 3000: столько слушает dev-сервер Vite (frontend/vite.config.js),
      # и туда набор ходит напрямую. В других джобах стоит 5173 — это дефолт
      # vite preview, к браузерной проверке отношения не имеет.
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ADMIN_EMAILS: admin@delo.ru
      DEMO_PASSWORD: ci-demo-password
      # Браузер ходит на frontend, а тот проксирует /login и /users на backend.
      # CSRF включён намеренно: набор проверяет, что форма работает и при
      # включённой защите, а не только когда её нет.
      CSRF_ENABLED: "1"
      COOKIE_SECURE: "0"
      # Лимит по аккаунту выключен. Набор сам делает вход с заведомо неверным
      # паролем (шаг 4) и ещё раз — с уже недействительным (шаг 5), а окно
      # лимита — 15 минут, то есть переживает весь прогон. С включённым
      # лимитом шаг 5 получал 429 на входе по новому паролю, шаг 6 не мог
      # вернуть исходный пароль, и набор оставлял админа с чужим паролем при
      # старом значении в demo_password.txt.
      #
      # Это не ослабление проверки: лимит перебора проверяется отдельно и
      # целенаправленно в джобе login-throttle, где для него всё и заведено.
      RATE_LIMIT_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Playwright ставим вне frontend: в package.json приложения его нет и
      # не должно быть — он нужен одной проверке, а не сборке.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply migrations to a clean database
        working-directory: backend
        run: alembic upgrade head

      - name: Seed demo data
        working-directory: backend
        run: python seed_demo.py

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/csrf-token > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start, dumping log:"
          cat /tmp/uvicorn.log
          exit 1

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          # dev, а не preview: набор проверяет форму на том сервере, где она
          # ходит через прокси Vite — как у разработчика.
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start, dumping log:"
          cat /tmp/vite.log
          exit 1

      # Гейт: набор доказывает, что форма работает. Если браузер не поднялся
      # или фронтенд отдаёт не то, падение должно быть внятным здесь, а не
      # «заголовок Безопасность не виден» внутри набора.
      - name: Assert the page renders and CSRF is armed
        run: |
          set -e
          python - <<'PY'
          import json, urllib.error, urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/csrf-token", timeout=15) as resp:
              token = json.loads(resp.read())["csrf_token"]
          assert token, "GET /csrf-token не вернул токен"
          print("CSRF армед: токен выдан")

          # POST /users/me/password без токена обязан отбиваться, иначе набор
          # шага 6 ничего не доказывал бы. Токен доступа здесь заведомо мусорный
          # и ЛАТИНИЦЕЙ: значения HTTP-заголовков кодируются в latin-1, и
          # кириллица в них падает с UnicodeEncodeError ещё до отправки.
          req = urllib.request.Request(
              "http://127.0.0.1:8000/users/me/password",
              data=json.dumps({"current_password": "probe", "new_password": "probe-probe"}).encode(),
              headers={"Content-Type": "application/json", "Authorization": "Bearer garbage"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"ожидался отказ, пришло {resp.status}")
          except urllib.error.HTTPError as exc:
              # 403 — заголовок CSRF/X-CSRF отсутствует, 401 — токен не принят.
              # Любой из них доказывает, что эндпоинт закрыт.
              assert exc.code in (401, 403), f"ожидался 401/403, пришло {exc.code}"
              print(f"эндпоинт смены пароля защищён: {exc.code}")
          PY

      - name: Check profile password form
        run: node tests/security/check_profile_password_form.mjs

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== uvicorn ==="
          tail -n 100 /tmp/uvicorn.log || true
          echo "=== vite ==="
          tail -n 60 /tmp/vite.log || true

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: password-form-screenshots
          path: visual-check/*.png
          if-no-files-found: ignore
