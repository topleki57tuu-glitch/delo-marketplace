# Временный workflow: рендерит PNG/ICO из SVG-исходников и коммитит их
# в эту ветку. Нужен один раз — инструмент, которым публикуются изменения,
# не умеет загружать бинарные файлы. Удаляется следующим коммитом и в main
# не попадает.
name: Brand assets (one-off)

on:
  push:
    branches: [design/app-shell]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render PNG and ICO from SVG
        run: |
          npm install --no-save --ignore-scripts @resvg/resvg-wasm@2.6.2
          node scripts/build-brand-assets.mjs

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/apple-touch-icon.png public/og-image.png public/icons
          if git diff --cached --quiet; then echo "Нечего коммитить"; exit 0; fi
          git commit -m "chore(brand): PNG/ICO-иконки и превью для соцсетей из SVG"
          git push origin HEAD:design/app-shell
