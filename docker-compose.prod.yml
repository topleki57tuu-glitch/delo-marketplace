# Production-стек «ДЕЛО» для своего VPS.
# Весь трафик идёт через Caddy (порты 80/443, автоматический HTTPS при домене),
# фронтенд-nginx и backend не публикуют порты наружу.
#
# Запуск:  bash scripts/vps_deploy.sh   (создаст .env и поднимет всё сам)

# Общее окружение backend, worker и beat — один блок, а не три копии.
#
# Копии здесь были бы не стилистической придиркой: именно так и получилось,
# что воркера нет ни в одном контуре. Переменные для backend кто-то дописывал
# (YOOMONEY_*, ADMIN_EMAILS), воркера при этом не добавлял, а 11 задач Celery —
# включая уборку файлов и снятие истёкших PRO — не выполнялись никем.
# Один блок означает, что новая переменная появляется сразу у всех трёх.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_db}
  # Без реального SECRET_KEY backend в production не стартует (см. app/core/config.py)
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
  ENV: production
  FRONTEND_URL: ${FRONTEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  # Без явного списка модераторов их нет вовсе: раньше дефолтом был
  # admin@delo.ru, а почта при регистрации не подтверждается — права
  # модератора получал любой, кто первым занял этот адрес.
  ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in .env (comma-separated)}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  # Счётчики лимитов в общем Redis, иначе они живут в памяти каждого воркера
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  # ЮMoney — провайдер по умолчанию в POST /payments/create. Без этих
  # переменных он отвечал «не настроен», и на своём VPS работала только
  # ЮKassa. NOTIFICATION_SECRET обязателен для проверки подписи вебхука.
  YOOMONEY_ACCESS_TOKEN: ${YOOMONEY_ACCESS_TOKEN:-}
  YOOMONEY_CLIENT_ID: ${YOOMONEY_CLIENT_ID:-}
  YOOMONEY_REDIRECT_URI: ${YOOMONEY_REDIRECT_URI:-}
  YOOMONEY_NOTIFICATION_SECRET: ${YOOMONEY_NOTIFICATION_SECRET:-}
  # Куда возвращать пользователя после оплаты. Без переменной возврат
  # уходил на пустой путь и платёж не подтверждался автоматически.
  YOOMONEY_RETURN_PATH: ${YOOMONEY_RETURN_PATH:-/profile}

services:
  caddy:
    image: caddy:2-alpine
    container_name: marketplace_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  postgres:
    image: postgres:15-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    # Порт наружу не публикуем — БД доступна только внутри сети compose
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - backend_uploads:/app/uploads

  # Воркер Celery. Без него не выполняется ни одна из задач app/tasks/*:
  # ни уборка уведомлений и истёкших токенов, ни снятие флагов PRO. Раньше его
  # не было ни здесь, ни в render.yaml, ни в ecosystem.config.cjs, и подсистема
  # из 11 задач существовала только на бумаге.
  #
  # Образ тот же, что у backend: задачам нужны те же модели и та же база.
  # `--concurrency` не задаём — Celery выберет по числу ядер; для этого
  # профиля нагрузки больше и не нужно.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_worker
    restart: unless-stopped
    # Воркеру нужен брокер, а брокер — это Redis. Postgres тоже нужен:
    # задачи ходят в базу напрямую.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
    command: celery -A app.core.celery_app worker --loglevel=info

  # Планировщик. Воркер исполняет задачи, но НЕ решает, когда их запускать:
  # за расписание отвечает beat, и это отдельный процесс. Без него воркер
  # простоял бы вечно с пустой очередью — то есть «поднять воркер» без beat
  # не решает задачу, а только создаёт видимость.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace_beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
    # Расписание beat по умолчанию хранит в файле `celerybeat-schedule` рядом
    # с рабочим каталогом. В контейнере это /app — если том не примонтировать,
    # файл исчезнет при пересоздании и расписание начнётся заново. Для наших
    # crontab-задач это безвредно, но том убирает вопрос целиком. Путь задаём
    # явно, иначе том окажется примонтирован, а beat будет писать мимо него.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/beat-schedule/celerybeat-schedule
    volumes:
      - beat_schedule:/app/beat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace_frontend
    restart: unless-stopped
    depends_on:
      - backend

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: marketplace_bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TG_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL}

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  caddy_data:
  caddy_config:
  beat_schedule:
